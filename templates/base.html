<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Streamer{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>

<!-- ====================================================== -->
<!--  Navigation                                           -->
<!-- ====================================================== -->
<nav class="mcr-nav">
  <a href="/" class="brand">
    <div class="brand-icon"><i class="bi bi-broadcast-pin"></i></div>
    Streamer
  </a>

  <ul class="nav-links">
    <li>
      <a href="/" class="{% if request.endpoint == 'index' %}active{% endif %}">
        <i class="bi bi-speedometer2"></i> Dashboard
      </a>
    </li>
    <li>
      <a href="/calendar" class="{% if request.endpoint == 'calendar' %}active{% endif %}">
        <i class="bi bi-calendar3"></i> Schedule
      </a>
    </li>
    <li>
      <a href="/channels" class="{% if request.endpoint == 'channels' %}active{% endif %}">
        <i class="bi bi-collection-play"></i> Channels
      </a>
    </li>
    <li>
      <a href="/settings" class="{% if request.endpoint == 'settings' %}active{% endif %}">
        <i class="bi bi-gear"></i> Settings
      </a>
    </li>
  </ul>

  <span class="clock" id="utc-clock"></span>
</nav>

<!-- ====================================================== -->
<!--  Toast container                                       -->
<!-- ====================================================== -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999" id="toast-area"></div>

<!-- ====================================================== -->
<!--  Page                                                  -->
<!-- ====================================================== -->
<div class="page-wrap">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Live UTC clock
  function _tick() {
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    document.getElementById('utc-clock').textContent =
      `${now.getUTCFullYear()}-${pad(now.getUTCMonth()+1)}-${pad(now.getUTCDate())} `
      + `${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())}:${pad(now.getUTCSeconds())} UTC`;
  }
  _tick(); setInterval(_tick, 1000);

  // Toast helper — call from any page script
  function showToast(msg, type='success', duration=3500) {
    const icons = {success:'check-circle-fill', danger:'x-circle-fill',
                   warning:'exclamation-triangle-fill', info:'info-circle-fill'};
    const colors = {success:'var(--success)', danger:'var(--danger)',
                    warning:'var(--warning)', info:'var(--accent-hover)'};
    const id = 'toast-' + Date.now();
    const html = `
      <div id="${id}" class="toast show align-items-center" role="alert"
           style="min-width:260px;border-left:3px solid ${colors[type]||colors.info}">
        <div class="d-flex toast-body gap-2">
          <i class="bi bi-${icons[type]||icons.info}" style="color:${colors[type]||colors.info};font-size:1rem;flex-shrink:0;margin-top:1px"></i>
          <span>${msg}</span>
          <button type="button" class="btn-close btn-close-white ms-auto"
                  onclick="this.closest('.toast').remove()" style="font-size:0.65rem"></button>
        </div>
      </div>`;
    document.getElementById('toast-area').insertAdjacentHTML('beforeend', html);
    setTimeout(() => document.getElementById(id)?.remove(), duration);
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
