<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Streamer MCR{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold text-warning" href="/">
      <i class="bi bi-broadcast-pin me-2"></i>Streamer MCR
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navmenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navmenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}"
             href="/">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'calendar' %}active{% endif %}"
             href="/calendar">
            <i class="bi bi-calendar3 me-1"></i>Schedule
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'channels' %}active{% endif %}"
             href="/channels">
            <i class="bi bi-collection-play me-1"></i>Channels
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'assets' %}active{% endif %}"
             href="/assets">
            <i class="bi bi-film me-1"></i>Media Pool
          </a>
        </li>
      </ul>
      <span class="navbar-text text-secondary small" id="utc-clock"></span>
    </div>
  </div>
</nav>

<div class="container-fluid py-3 px-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // UTC clock
  function updateClock() {
    document.getElementById('utc-clock').textContent =
      new Date().toUTCString().replace(' GMT', ' UTC');
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>
{% block scripts %}{% endblock %}
</body>
</html>
