{% extends "base.html" %}
{% block title %}Schedule – Streamer MCR{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.14/index.global.min.css">
<style>
  #calendar { background:#1a1a1a; border-radius:8px; padding:12px; }
  .fc { color:#e0e0e0; }
  .fc-toolbar-title { color:#fff; }
  .fc-button { background:#333 !important; border-color:#555 !important; color:#eee !important; }
  .fc-button:hover { background:#444 !important; }
  .fc-button-active { background:#0d6efd !important; border-color:#0d6efd !important; }
  .fc-day-today { background:rgba(255,193,7,0.06) !important; }
  .fc-col-header-cell-cushion, .fc-daygrid-day-number { color:#aaa; text-decoration:none; }
  .fc-event { cursor:pointer; font-size:0.8rem; }
  .fc-timegrid-slot { border-color:#2a2a2a; }
  .fc-scrollgrid { border-color:#333; }
  .fc-scrollgrid td, .fc-scrollgrid th { border-color:#333; }
</style>
{% endblock %}

{% block content %}
<div class="row g-3">

  <!-- Controls bar -->
  <div class="col-12 d-flex flex-wrap gap-2 align-items-center">
    <select class="form-select form-select-sm bg-dark text-light border-secondary"
            id="channel-filter" style="max-width:200px;" onchange="filterChanged()">
      <option value="">All channels</option>
      {% for ch in channels %}
        <option value="{{ ch.id }}" style="color:{{ ch.color }}">{{ ch.name }}</option>
      {% endfor %}
    </select>
    <button class="btn btn-sm btn-outline-success ms-auto" onclick="openNewEventModal()">
      <i class="bi bi-plus-lg me-1"></i>New Event
    </button>
  </div>

  <div class="col-12">
    <div id="calendar"></div>
  </div>

</div>

<!-- ======================================================= -->
<!-- Event modal                                             -->
<!-- ======================================================= -->
<div class="modal fade" id="eventModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content bg-dark text-light border-secondary">
      <div class="modal-header border-secondary">
        <h5 class="modal-title" id="eventModalTitle">New Event</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">

        <!-- Mode selector (shown only when editing a recurring event) -->
        <div id="editModeRow" class="d-none mb-3">
          <label class="form-label small text-secondary">Edit scope</label>
          <div class="btn-group w-100" role="group">
            <input type="radio" class="btn-check" name="editMode" id="modeThis" value="this" checked>
            <label class="btn btn-outline-secondary btn-sm" for="modeThis">This occurrence</label>
            <input type="radio" class="btn-check" name="editMode" id="modeAll" value="all">
            <label class="btn btn-outline-secondary btn-sm" for="modeAll">All occurrences</label>
          </div>
        </div>

        <form id="eventForm">
          <input type="hidden" id="f-entry-id">
          <input type="hidden" id="f-occurrence-date">

          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label small">Title *</label>
              <input class="form-control bg-black text-light border-secondary"
                     id="f-title" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small">Channel *</label>
              <select class="form-select bg-black text-light border-secondary" id="f-channel">
                {% for ch in channels %}
                  <option value="{{ ch.id }}">{{ ch.name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label small">Start (UTC) *</label>
              <input type="datetime-local" class="form-control bg-black text-light border-secondary"
                     id="f-start" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small">Duration (seconds) *</label>
              <input type="number" class="form-control bg-black text-light border-secondary"
                     id="f-duration" value="3600" min="1" required>
            </div>

            <div class="col-12">
              <label class="form-label small">Type</label>
              <div class="btn-group" role="group">
                <input type="radio" class="btn-check" name="entryType" id="typeFile" value="file" checked>
                <label class="btn btn-outline-secondary btn-sm" for="typeFile">
                  <i class="bi bi-file-earmark-play me-1"></i>File
                </label>
                <input type="radio" class="btn-check" name="entryType" id="typeLive" value="live">
                <label class="btn btn-outline-secondary btn-sm" for="typeLive">
                  <i class="bi bi-camera-video me-1"></i>Live SDI
                </label>
                <input type="radio" class="btn-check" name="entryType" id="typeRec" value="recording">
                <label class="btn btn-outline-secondary btn-sm" for="typeRec">
                  <i class="bi bi-record-circle me-1"></i>Record + Air
                </label>
              </div>
            </div>

            <!-- File picker -->
            <div class="col-12" id="filePicker">
              <label class="form-label small">Asset path</label>
              <div class="input-group">
                <input class="form-control bg-black text-light border-secondary"
                       id="f-asset-path" placeholder="/mnt/MasterControlMedia/…">
                <button class="btn btn-outline-secondary" type="button"
                        onclick="openAssetPicker()">Browse</button>
              </div>
            </div>

            <!-- Live source -->
            <div class="col-12 d-none" id="liveSource">
              <label class="form-label small">Live source</label>
              <input class="form-control bg-black text-light border-secondary"
                     id="f-live-source" value="dektec:0:0"
                     placeholder="dektec:0:0 or udp://…">
            </div>

            <!-- Recurrence -->
            <div class="col-12">
              <label class="form-label small">Repeat (RRULE)</label>
              <div class="row g-2 mb-1">
                <div class="col-auto">
                  <button type="button" class="btn btn-xs btn-outline-secondary"
                          onclick="setRrule('')">Once</button>
                </div>
                <div class="col-auto">
                  <button type="button" class="btn btn-xs btn-outline-secondary"
                          onclick="setRrule('FREQ=DAILY')">Daily</button>
                </div>
                <div class="col-auto">
                  <button type="button" class="btn btn-xs btn-outline-secondary"
                          onclick="setRrule('FREQ=WEEKLY')">Weekly</button>
                </div>
                <div class="col-auto">
                  <button type="button" class="btn btn-xs btn-outline-secondary"
                          onclick="setRrule('FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR')">Mon–Fri</button>
                </div>
                <div class="col-auto">
                  <button type="button" class="btn btn-xs btn-outline-secondary"
                          onclick="setRrule('FREQ=WEEKLY;BYDAY=SA,SU')">Weekends</button>
                </div>
              </div>
              <input class="form-control bg-black text-light border-secondary font-monospace small"
                     id="f-rrule" placeholder="Leave blank for one-off">
            </div>

            <div class="col-md-4">
              <label class="form-label small">Colour</label>
              <input type="color" class="form-control form-control-color bg-black border-secondary"
                     id="f-color" value="#3788d8">
            </div>
            <div class="col-md-8">
              <label class="form-label small">Notes</label>
              <input class="form-control bg-black text-light border-secondary"
                     id="f-notes" placeholder="Optional">
            </div>
          </div>
        </form>

      </div>
      <div class="modal-footer border-secondary">
        <button type="button" class="btn btn-danger me-auto d-none" id="btn-delete-event"
                onclick="deleteEvent()">
          <i class="bi bi-trash me-1"></i>Delete
        </button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveEvent()">
          <i class="bi bi-check2 me-1"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Asset picker modal -->
<div class="modal fade" id="assetModal" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content bg-dark text-light border-secondary">
      <div class="modal-header border-secondary">
        <h5 class="modal-title">Select Asset</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input class="form-control bg-black text-light border-secondary mb-2"
               id="asset-search" placeholder="Filter by name…" oninput="filterAssets()">
        <div id="asset-list" class="table-responsive" style="max-height:400px;overflow-y:auto;"></div>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.14/index.global.min.js"></script>
<script src="{{ url_for('static', filename='js/calendar_app.js') }}"></script>
{% endblock %}
